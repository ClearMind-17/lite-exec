name: Lite Exec tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - if: runner.os == 'Windows'
        run: npm test -- --powershell
      - run: node scripts/spill-check.mjs
      - run: npm pack --dry-run
